# Wystawia aplikację (folder app/) na GitHub Pages.
# Codziennie o 6:00 czasu polskiego odświeża wiadomości z branży przed wystawieniem.
name: Wystaw aplikacje

on:
  push:
    branches: [main]
  schedule:
    - cron: "0 4 * * *"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  wystaw:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Odswiez wiadomosci
        continue-on-error: true
        run: python3 skrypty/zbuduj_aktualnosci.py
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: app
      - id: deploy
        uses: actions/deploy-pages@v4
